# ReviewForge alert rules (PrometheusRule). PromQL against the Prometheus-sanitized
# OBS-1 series names (dots -> underscores; histograms gain _bucket/_sum/_count).
#
# Two rule families, per the roadmap (item 3.4):
#   - STATIC floors detect *broken*: conditions that are never acceptable regardless of
#     history (queue rejecting, failure rate, task_done missing). These fire from day one.
#   - BASELINE-RELATIVE rules detect *drift*: ratios against 14-day recording-rule
#     baselines of this system's own normal. They gate on the baseline series existing
#     (`and on() (count(...))`) so a cold start with no history never fires.
#
# Route all to a low-noise channel first to measure false positives before paging.

groups:
  - name: reviewforge-baselines
    rules:
      # 14-day average run duration (ms) across all runs.
      - record: reviewforge:run_duration_ms:baseline_avg14d
        expr: |
          sum(rate(reviewforge_review_duration_ms_sum[14d]))
          /
          sum(rate(reviewforge_review_duration_ms_count[14d]))

      # 14-day average per-stage duration (ms), tagged by stage.
      - record: reviewforge:stage_duration_ms:baseline_avg14d
        expr: |
          sum by (stage) (rate(reviewforge_stage_duration_ms_sum[14d]))
          /
          sum by (stage) (rate(reviewforge_stage_duration_ms_count[14d]))

      # 14-day average LLM tokens consumed per completed run.
      - record: reviewforge:llm_tokens_per_run:baseline_avg14d
        expr: |
          sum(rate(reviewforge_llm_tokens_total[14d]))
          /
          sum(rate(reviewforge_reviews_completed_total[14d]))

      # 14-day average queue depth.
      - record: reviewforge:queue_depth:baseline_avg14d
        expr: avg_over_time(reviewforge_queue_depth[14d])

  - name: reviewforge
    rules:
      # ---- Static floors: broken, never acceptable, fire from day one ----

      - alert: ReviewForgeQueueSaturated
        expr: reviewforge_queue_depth / reviewforge_queue_capacity > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Review queue is over 80% full"
          description: "Queue depth is {{ $value | humanizePercentage }} of capacity."

      - alert: ReviewForgeQueueRejecting
        expr: rate(reviewforge_queue_rejected_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Review queue is rejecting submissions"
          description: "Submissions are being rejected (queue full) — lost review work."

      - alert: ReviewForgeRunFailureRate
        expr: rate(reviewforge_reviews_completed_total{result="failed"}[15m]) / rate(reviewforge_reviews_completed_total[15m]) > 0.05
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Review run failure rate exceeded 5%"
          description: "{{ $value | humanizePercentage }} of recent runs failed."

      - alert: ReviewForgeTaskDoneMissing
        expr: rate(reviewforge_agent_task_done_missing_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Agent reached iteration cap without task_done"
          description: "The review agent is hitting its iteration cap without completing."

      - alert: ReviewForgeEnrichmentFailing
        expr: rate(reviewforge_enrichment_failures_total[15m]) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Context enrichment is failing"
          description: "Enrichment is failing (fail-safe, non-fatal, but degrading context)."

      - alert: ReviewForgeClaimsExpiring
        expr: rate(reviewforge_claims_expired_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "In-flight claims are expiring"
          description: "Claim expiry observed — possible P1-6 regression (claim lost while queued)."

      # ---- Baseline-relative: drift against this system's own 14-day normal ----
      # Fires only once baseline history exists (the `and on() (count(...))` gate); a
      # cold start with no history stays silent instead of guessing.

      - alert: ReviewForgeRunLatencyDrift
        expr: |
          (
            histogram_quantile(0.95, sum by (le) (rate(reviewforge_review_duration_ms_bucket[30m])))
            /
            reviewforge:run_duration_ms:baseline_avg14d
          ) > 3
          and on() (count(reviewforge:run_duration_ms:baseline_avg14d) > 0)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Review run p95 latency drifted from baseline"
          description: "p95 run latency is {{ $value | humanize }}x the 14-day baseline average."

      - alert: ReviewForgeStageLatencyDrift
        # No existence gate needed: the on(stage) division drops any stage without a
        # baseline, so cold starts (no history at all) cannot fire this alert.
        expr: |
          (
            histogram_quantile(0.95, sum by (le, stage) (rate(reviewforge_stage_duration_ms_bucket[30m])))
            /
            on(stage) reviewforge:stage_duration_ms:baseline_avg14d
          ) > 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Stage {{ $labels.stage }} p95 latency drifted from baseline"
          description: "Stage {{ $labels.stage }} p95 is {{ $value | humanize }}x its 14-day baseline average."

      - alert: ReviewForgeTokenDrift
        expr: |
          (
            sum(rate(reviewforge_llm_tokens_total[1h]))
            /
            sum(rate(reviewforge_reviews_completed_total[1h]))
          )
          /
          reviewforge:llm_tokens_per_run:baseline_avg14d > 3
          and on() (count(reviewforge:llm_tokens_per_run:baseline_avg14d) > 0)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "LLM token burn drifted from baseline"
          description: "Tokens per run are {{ $value | humanize }}x the 14-day baseline — cost anomaly."

      - alert: ReviewForgeQueueDepthDrift
        expr: |
          reviewforge_queue_depth
          /
          reviewforge:queue_depth:baseline_avg14d > 3
          and on() (count(reviewforge:queue_depth:baseline_avg14d) > 0)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Queue depth drifted from baseline"
          description: "Queue depth is {{ $value | humanize }}x the 14-day baseline average — reviews backing up."
