name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Least privilege: checkout needs contents:read; nothing else by default.
permissions:
  contents: read

jobs:
  build-and-test:
    permissions:
      contents: read
      checks: write # dorny/test-reporter publishes check runs
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ReviewForge.slnx --locked-mode

      # Dependency-vulnerability gate: fails on any known advisory in the
      # (transitive) package graph so CVEs cannot merge silently.
      - name: Vulnerability audit
        shell: bash
        run: |
          output="$(dotnet list ReviewForge.slnx package --vulnerable --include-transitive 2>&1)"
          echo "$output"
          if grep -q "has the following vulnerabilities" <<<"$output"; then
            echo "::error::known-vulnerable packages detected — see the list above"
            exit 1
          fi

      # -warnaserror: any compiler/analyzer warning fails the build.
      - name: Build
        run: dotnet build ReviewForge.slnx --no-restore --configuration Release -warnaserror

      # Sandbox/containment tests (PathSafety, RepoPathGuard, RepoReadTools, anchor
      # validation) create symlinks. Without Developer Mode the non-elevated runner
      # lacks SeCreateSymbolicLinkPrivilege, so those tests return early and the
      # symlink-resolution branches in ReviewForge.Core remain partially uncovered.
      - name: Enable Developer Mode (symlink privilege for sandbox tests)
        if: runner.os == 'Windows'
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f

      # CollectCoverage=true enforces each project's 95% line-coverage threshold.
      # Per-project invocation keeps TRX files distinct and continues after failures.
      - name: Test
        shell: bash
        run: |
          failed=0
          for proj in tests/*/; do
            name="$(basename "$proj")"
            dotnet test "$proj" --no-build --configuration Release \
              -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura \
              --logger "trx;LogFileName=$name.trx" \
              --results-directory TestResults || failed=1
          done
          exit "$failed"

      # Collect XPlat reports for the union-of-lines check in build-and-test.ps1.
      # This is separate from coverlet.msbuild, which enforces per-project thresholds.
      - name: Collect line coverage
        if: always()
        shell: bash
        run: |
          failed=0
          for proj in tests/*/; do
            dotnet test "$proj" --no-build --configuration Release \
              --collect:"XPlat Code Coverage" --settings coverage.runsettings \
              --results-directory CoverageResults || failed=1
          done
          exit "$failed"

      - name: Summarize line coverage
        if: always()
        shell: pwsh
        run: |
          $lines = @{}
          Get-ChildItem CoverageResults -Filter coverage.cobertura.xml -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$doc = Get-Content $_.FullName
            foreach ($class in $doc.SelectNodes('//class')) {
              foreach ($line in $class.SelectNodes('lines/line')) {
                $key = "$($class.filename)|$($line.number)"
                $lines[$key] = ($lines[$key] -eq $true) -or ([int]$line.hits -gt 0)
              }
            }
          }

          $valid = $lines.Count
          $covered = @($lines.Values | Where-Object { $_ }).Count
          if ($valid -eq 0) {
            Write-Error "Line coverage: no data (is coverlet.collector installed?)"
            exit 1
          }

          $summary = "Line coverage: {0:N1}% ({1}/{2})" -f ($covered / $valid * 100), $covered, $valid
          Write-Host $summary
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Test Results (${{ matrix.os }})
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: "true"

      # Visibility layer on top of the coverlet gate: per-project numbers in the
      # job summary, cobertura XML as an artifact, and an explicit fail below 95%.
      # Linux-only: irongut/CodeCoverageSummary is a Docker container action and
      # does not run on Windows; the csproj Threshold=95 gate still applies there.
      - name: Coverage summary
        if: always() && matrix.os == 'ubuntu-latest'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "CoverageResults/**/coverage.cobertura.xml"
          badge: "true"
          format: "markdown"
          output: "both"
          thresholds: "95 100"
          fail_below_min: "true"

      - name: Write coverage to job summary
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # May not exist if the Test step failed before coverlet wrote any report;
          # the Coverage summary step above already surfaces that failure.
          if [ -f code-coverage-results.md ]; then
            cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: "**/coverage.cobertura.xml"


  # One status check regardless of matrix leg: use "CI Result" for branch protection.
  ci-result:
    needs: [build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate matrix result
        run: |
          result="${{ needs.build-and-test.result }}"
          echo "Matrix result: $result"
          if [ "$result" != "success" ]; then
            exit 1
          fi
